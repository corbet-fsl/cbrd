[package]
name = "cbrd"
version = "0.1.0"
edition = "2024"
publish = false
description = "Board for device-side community composition"
repository = "https://github.com/corbet-libs/cbrd"
license-file = "LICENSE.md"

[lib]
crate-type = ["rlib"]

[features]
default = ["http"]
http = ["clnk/http"]
browser = ["clnk/browser"]

[dependencies]
clnk = { git = "https://github.com/corbet-foss/clnk", branch = "main", default-features = false }
csrh = { git = "https://github.com/corbet-foss/csrh", branch = "main" }
cxch = { git = "https://github.com/corbet-foss/cxch", branch = "main" }
cgrp = { git = "https://github.com/corbet-foss/cgrp", branch = "main" }
ctnd = { git = "https://github.com/corbet-foss/ctnd", branch = "main" }
cnvl = { git = "https://github.com/corbet-foss/cnvl", branch = "main" }
cshm = { git = "https://github.com/corbet-foss/cshm", branch = "main" }
serde = { version = "1", features = ["derive"] }
schemars = "1"

cpfl = { git = "https://github.com/corbet-foss/cpfl", branch = "main" }
ckmg = { git = "https://github.com/corbet-foss/ckmg", branch = "main" }
cwst = { git = "https://github.com/corbet-foss/cwst", branch = "main" }
cchr = { git = "https://github.com/corbet-foss/cchr", branch = "main" }

[dev-dependencies]
cgrd = { git = "https://github.com/corbet-foss/cgrd", branch = "main", default-features = false }
csgn = { git = "https://github.com/corbet-foss/csgn", branch = "main", default-features = false, features = ["volatile-signer"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
serde_json = "1"
futures-executor = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
browser-coverage-runtime = { path = ".ci/coverage-runtime" }
wasm-bindgen-test = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(owned_browser_coverage)"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cfrm = { git = "https://github.com/corbet-libs/cfrm", branch = "main", features = ["server"] }
cgth = { git = "https://github.com/corbet-libs/cgth", branch = "main" }
csrn = { git = "https://github.com/corbet-libs/csrn", branch = "main" }
cvtl = { git = "https://github.com/corbet-libs/cvtl", branch = "main" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt", "time", "sync", "net", "macros"] }
