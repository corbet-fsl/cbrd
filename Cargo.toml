[package]
name = "cbrd"
version = "0.1.0"
edition = "2024"
publish = false
description = "Board for device-side community composition"
repository = "https://git.corbet.ch/corbet-fsl/cbrd.git"
license-file = "LICENSE.md"

[lib]
crate-type = ["rlib"]

[features]
default = ["http"]
http = ["clnk/http"]
browser = ["clnk/browser"]
ohttp = ["clnk/ohttp"]

[dependencies]
clnk = { git = "https://git.corbet.ch/corbet-libre/clnk.git", branch = "main", default-features = false }
csrh = { git = "https://git.corbet.ch/corbet-libre/csrh.git", branch = "main" }
cxch = { git = "https://git.corbet.ch/corbet-libre/cxch.git", branch = "main" }
cgrp = { git = "https://git.corbet.ch/corbet-libre/cgrp.git", branch = "main" }
ctnd = { git = "https://git.corbet.ch/corbet-libre/ctnd.git", branch = "main" }
cthr = { git = "https://git.corbet.ch/corbet-libre/cthr.git", branch = "main" }
cnvl = { git = "https://git.corbet.ch/corbet-libre/cnvl.git", branch = "main" }
crbk = { git = "https://git.corbet.ch/corbet-libre/crbk.git", branch = "main", default-features = false }
cgrd = { git = "https://git.corbet.ch/corbet-libre/cgrd.git", branch = "main", default-features = false }
cshm = { git = "https://git.corbet.ch/corbet-libre/cshm.git", branch = "main" }
blake3 = "1"
chacha20poly1305 = "0.11"
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_json = "1"
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "chacha"] }

cpfl = { git = "https://git.corbet.ch/corbet-libre/cpfl.git", branch = "main" }
ckmg = { git = "https://git.corbet.ch/corbet-libre/ckmg.git", branch = "main" }
cwst = { git = "https://git.corbet.ch/corbet-libre/cwst.git", branch = "main" }
cchr = { git = "https://git.corbet.ch/corbet-libre/cchr.git", branch = "main" }
cvch = { git = "https://git.corbet.ch/corbet-libre/cvch.git", branch = "main" }

[dev-dependencies]
csgn = { git = "https://git.corbet.ch/corbet-libre/csgn.git", branch = "main", default-features = false, features = ["volatile-signer"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
futures-executor = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
browser-coverage-runtime = { package = "browser-coverage-runtime-cbrd", path = ".ci/coverage-runtime" }
wasm-bindgen-test = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(owned_browser_coverage)"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cfrm = { git = "https://git.corbet.ch/corbet-fsl/cfrm.git", branch = "main", features = ["server"] }
cgth = { git = "https://git.corbet.ch/corbet-fsl/cgth.git", branch = "main" }
csrn = { git = "https://git.corbet.ch/corbet-fsl/csrn.git", branch = "main" }
cvtl = { git = "https://git.corbet.ch/corbet-fsl/cvtl.git", branch = "main" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt", "time", "sync", "net", "macros"] }
