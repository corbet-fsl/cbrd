[package]
name = "cbrd"
version = "0.1.0"
edition = "2024"
publish = false
description = "Board for device-side community composition"
repository = "https://git.corbet.ch/corbet-libs/cbrd.git"
license-file = "LICENSE.md"

[lib]
crate-type = ["rlib"]

[features]
default = ["http"]
http = ["clnk/http"]
browser = ["clnk/browser"]
ohttp = ["clnk/ohttp"]

[dependencies]
clnk = { git = "https://git.corbet.ch/corbet-foss/clnk.git", branch = "v01", default-features = false }
csrh = { git = "https://git.corbet.ch/corbet-foss/csrh.git", branch = "main" }
cxch = { git = "https://git.corbet.ch/corbet-foss/cxch.git", branch = "main" }
cgrp = { git = "https://git.corbet.ch/corbet-foss/cgrp.git", branch = "main" }
ctnd = { git = "https://git.corbet.ch/corbet-foss/ctnd.git", branch = "main" }
cthr = { git = "https://git.corbet.ch/corbet-foss/cthr.git", branch = "main" }
cnvl = { git = "https://git.corbet.ch/corbet-foss/cnvl.git", branch = "v01" }
crbk = { git = "https://git.corbet.ch/corbet-foss/crbk", branch = "main", default-features = false }
cgrd = { git = "https://git.corbet.ch/corbet-foss/cgrd", branch = "main", default-features = false }
cshm = { git = "https://git.corbet.ch/corbet-foss/cshm", branch = "main" }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_json = "1"
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "chacha"] }

cpfl = { git = "https://git.corbet.ch/corbet-foss/cpfl.git", branch = "main" }
ckmg = { git = "https://git.corbet.ch/corbet-foss/ckmg.git", branch = "v01" }
cwst = { git = "https://git.corbet.ch/corbet-foss/cwst.git", branch = "v01" }
cchr = { git = "https://git.corbet.ch/corbet-foss/cchr.git", branch = "main" }

[dev-dependencies]
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", default-features = false, features = ["volatile-signer"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
futures-executor = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
browser-coverage-runtime = { path = ".ci/coverage-runtime" }
wasm-bindgen-test = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(owned_browser_coverage)"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cfrm = { git = "https://git.corbet.ch/corbet-libs/cfrm.git", branch = "v01", features = ["server"] }
cgth = { git = "https://git.corbet.ch/corbet-libs/cgth.git", branch = "main" }
csrn = { git = "https://git.corbet.ch/corbet-libs/csrn.git", branch = "main" }
cvtl = { git = "https://git.corbet.ch/corbet-libs/cvtl.git", branch = "v01" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt", "time", "sync", "net", "macros"] }
